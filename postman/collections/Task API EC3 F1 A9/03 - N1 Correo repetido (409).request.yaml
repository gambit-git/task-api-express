$kind: http-request
url: "http://localhost:3000/api/auth/register"
method: POST
body:
  type: json
  content: "{\n  \"name\": \"Ana Torres\",\n  \"email\": \"{{emailMixed}}\",\n  \"password\": \"{{password}}\",\n  \"confirmPassword\": \"{{password}}\"\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 USER_EMAIL_EXISTS', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error.code).to.eql('USER_EMAIL_EXISTS');
        pm.expect(pm.response.json().error.requestId).to.be.a('string');
      });
    language: text/javascript
order: 4000
