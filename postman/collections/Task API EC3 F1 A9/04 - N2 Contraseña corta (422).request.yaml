$kind: http-request
url: "http://localhost:3000/api/auth/register"
method: POST
body:
  type: json
  content: "{\n  \"name\": \"Ana Torres\",\n  \"email\": \"{{emailMixed}}\",\n  \"password\": \"corta\",\n  \"confirmPassword\": \"corta\"\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 en password', () => {
        pm.response.to.have.status(422);
        const error = pm.response.json().error;
        pm.expect(error.code).to.eql('AUTH_VALIDATION_ERROR');
        pm.expect(error.details.map((item) => item.field)).to.include('password');
      });
    language: text/javascript
order: 5000
