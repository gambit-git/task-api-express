$kind: http-request
url: "http://localhost:3000/api/auth/register"
method: POST
body:
  type: json
  content: "{\n  \"name\": \"Ana Torres\",\n  \"email\": \"{{emailMixed}}\",\n  \"password\": \"{{password}}\",\n  \"confirmPassword\": \"{{password}}\",\n  \"role\": \"admin\"\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 en role', () => {
        pm.response.to.have.status(422);
        const error = pm.response.json().error;
        pm.expect(error.code).to.eql('AUTH_VALIDATION_ERROR');
        pm.expect(error.details.map((item) => item.field)).to.include('role');
      });
    language: text/javascript
order: 7000
