$kind: http-request
url: "http://localhost:3000/api/auth/login"
method: POST
body:
  type: json
  content: "{\n  \"email\": \"{{email}}\",\n  \"password\": \"{{password}} incorrecta\"\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 INVALID_CREDENTIALS', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS');
      });
      pm.collectionVariables.set('loginMessage', pm.response.json().error.message);
    language: text/javascript
order: 10000
